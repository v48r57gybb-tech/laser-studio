name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p site
          # Copia i file web principali se presenti
          for f in index.html arc.html arc.js iso-v2.js app.js vector.html; do
            if [ -f "$f" ]; then cp "$f" site/; fi
          done
          # Copia le cartelle opzionali se presenti
          if [ -d "icons" ]; then cp -r icons site/; fi
          if [ -d "lib" ]; then cp -r lib site/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
