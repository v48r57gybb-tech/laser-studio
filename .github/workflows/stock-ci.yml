name: Stock CI

on:
  push:
    branches:
      - feature/lavorazione-da-grezzo
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: node --test tests/*.test.mjs
      - name: Run generation test
        run: npm run test:generation
      - name: Build
        run: npm run build
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.51.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test browser desktop e telefono
        run: node browser-tests/stock-interface.mjs
      - name: Test anteprima geometrica 3D
        run: node browser-tests/stock-preview.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: browser-results
          if-no-files-found: warn
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
