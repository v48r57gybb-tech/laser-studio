name: Project v2 CI

on:
  push:
    branches:
      - feature/lavorazione-progetto-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test contratto Fase 1
        run: node --test tests/project-v2/package-contract.test.mjs
